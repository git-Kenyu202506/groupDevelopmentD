<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>ID受け渡しテスト</title>
</head>

<body>

  <div th:replace="header :: header"></div>
  <h1>ID受け渡しテスト（削除画面）</h1>

  <p th:if="${selectedUsers == null or #lists.isEmpty(selectedUsers)}">
    選択されたユーザーはありません。
  </p>

  <div th:each="user : ${selectedUsers}">
    <h2>以下のユーザーを削除しますか？</h2>

    <table border="1">
      <tr>
        <th>ID</th>
        <th>氏名</th>
        <th>年齢</th>
        <th>開始日</th>
        <th>終了日</th>
      </tr>
      <tr>
        <td>
          <input type="hidden" name="ids" th:value="${user.id}" />
          <span th:text="${user.id}"></span>
        </td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.day_start}"></td>
        <td th:text="${user.day_end}"></td>
      </tr>
    </table>
  </div>
</body>

</html>
