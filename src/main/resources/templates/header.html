<!-- templates/header.html -->
<div th:fragment="header">
    <header th:if="${user != null}" style="background-color:#f5f5f5; padding:10px;">
        <p>
          <span th:text="${user.name}"></span> さん（ID: <span th:text="${user.id}"></span>）
        </p>
        <span th:text="${#temporals.format(loginTime, 'yyyy/MM/dd HH:mm:ss')}"></span>
        <span th:if="${user == null}">
            （未ログイン）
        </span>
    </header>
</div>
