<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新規登録</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<script th:if="${error}">
    alert([['${error}']]);
</script>
<script>
function validateRegister() {
    const name = document.querySelector('input[name="name"]').value.trim();
    const age = document.querySelector('input[name="age"]').value.trim();
    const startDate = document.querySelector('input[name="day_start"]').value;
    const endDate = document.querySelector('input[name="day_end"]').value;
    const password = document.querySelector('input[name="password"]').value;
    const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
    let errors = [];

    if (!name) errors.push("社員名は必須入力です。");
    else if (/\d/.test(name)) errors.push("社員名に数字を含めないでください。");
    if (!age) errors.push("年齢は必須入力です。");
    else if (!/^\d+$/.test(age)) errors.push("年齢は数値で入力してください。");
    if (!startDate) errors.push("開始日は必須入力です。");
    if (startDate && endDate && new Date(startDate) > new Date(endDate)) {
        errors.push("開始日は終了日より前にしてください。");
    }
    if (!password) errors.push("パスワードは必須入力です。");
    else if (password.length < 8) errors.push("パスワードは8文字以上で入力してください。");
    else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)[a-zA-Z\\d]+$/.test(password)) {
        errors.push("パスワードは半角英数（大文字含む）で入力してください。");
    }
    if (!confirmPassword) errors.push("パスワード確認は必須入力です。");
    else if (password !== confirmPassword) errors.push("パスワードと確認用が一致しません。");

    if (errors.length > 0) { alert(errors.join("\\n")); return false; }
    return true;
}
</script>
</head>
<body>
<div class="form-container">
    <h2>社員情報登録</h2>
    <form th:action="@{/register/confirm}" th:object="${user}" method="post" 
          class="form-box" onsubmit="return validateRegister()">
        <label>名前:</label>
        <input type="text" th:field="*{name}" name="name">
        <label>年齢:</label>
        <input type="number" th:field="*{age}" name="age">
        <label>開始日:</label>
        <input type="date" th:field="*{day_start}" name="day_start">
        <label>終了日:</label>
        <input type="date" th:field="*{day_end}" name="day_end">
        <label>パスワード:</label>
        <input type="password" th:field="*{password}" name="password">
        <label>パスワード確認:</label>
        <input type="password" name="confirmPassword">
        <button type="submit">確認へ</button>
    </form>
</div>
</body>
</html>
