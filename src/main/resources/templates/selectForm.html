<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: header('社員情報検索')"></head>

<body>
    <div class="container">
        <div th:if="${error}" style="color:red;">
            <p th:text="${error}"></p>
        </div>
        <div th:if="${error_select}" style="color:red;">
            <p th:text="${error_select}"></p>
        </div>

        <div class="top-button-group">
            <a class="buttonMenu" th:href="@{/index}"><button type="button">メニュー</button></a>
            <a class="buttonInsert" th:href="@{/insert}"><button type="button">登録</button></a>
        </div>

        <form th:action="@{/selectResult}" th:object="${condition}" method="post" class="search-form">
            <div class="form-fields">
                <table class="form-table">
                    <tbody>
                        <tr>
                            <td>社員ID <input type="text" th:field="*{id}"></td>
                            <td>年齢 <input type="text" th:field="*{age_min}"> ~ <input type="text" th:field="*{age_max}">
                            </td>
                        </tr>
                        <tr>
                            <td>社員名 <input type="text" th:field="*{name}"></td>
                            <td>
                                開始日
                                <input type="text" th:field="*{day_start_min}" placeholder="yyyy/MM/dd"
                                    pattern="\d{4}/\d{2}/\d{2}" title="yyyy/MM/dd 形式で入力">
                                ~
                                <input type="text" th:field="*{day_start_max}" placeholder="yyyy/MM/dd">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                終了日
                                <input type="text" th:field="*{day_end_min}" placeholder="yyyy/MM/dd">
                                ~
                                <input type="text" th:field="*{day_end_max}" placeholder="yyyy/MM/dd">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="form-actions">
                <input class="button" type="submit" value="検索">
                <a th:href="@{/clearCondition}"><button type="button">クリア</button></a>
            </div>
        </form>

        <form th:if="${error} == null" th:action="@{/delete}" method="post" id="deleteForm">
            <div class="result-header">
                <div class="result-count" th:if="${count != null}">
                    <span th:text="${count}"></span>
                    <span>件</span>
                </div>
                <div class="delete-button">
                    <input class="button" type="submit" id="deleteBtn" value="削除">
                </div>
            </div>
            <div class="result-body">
                <table th:if="${userList != null and not #lists.isEmpty(userList)}" border="1">
                    <tr>
                        <th></th>
                        <th>ID</th>
                        <th>氏名</th>
                        <th>年齢</th>
                        <th>開始日</th>
                        <th>終了日</th>
                    </tr>
                    <tr th:each="user : ${userList}">
                        <td>
                            <input type="checkbox" name="selectedUser" th:value="${user.id}" class="userCheckbox" />
                        </td>
                        <td>
                            <a th:href="@{/update/{id}(id=${user.id})}" th:text="${user.id}"></a>
                        </td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.day_start}"></td>
                        <td th:text="${user.day_end}"></td>
                    </tr>
                </table>
                <div th:if="${userList != null and #lists.isEmpty(userList)}" style="color:red;">
                    <p>該当するユーザーは見つかりませんでした。</p>
                </div>

                <div th:replace="footer :: footer"></div>
            </div>
        </form>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.userCheckbox');
        const deleteBtn = document.getElementById('deleteBtn');

        // Function to update the button's visual state
        function updateButtonState() {
            const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
            if (anyChecked) {
                deleteBtn.classList.remove('disabled');
            } else {
                deleteBtn.classList.add('disabled');
            }
        }

        // Set initial state on page load
        updateButtonState();

        // Add listeners to checkboxes to update button state
        checkboxes.forEach(cb => cb.addEventListener('change', updateButtonState));

        // Add click listener to the delete button
        deleteBtn.addEventListener('click', (e) => {
            const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
            if (!anyChecked) {
                e.preventDefault(); // Prevent form submission
                alert('削除するユーザーを選択してください。');
            }
        });
    </script>
    <!-- エラーメッセージがある場合のみポップアップ表示 -->
    <script th:if="${error != null}">
        alert('[[${error}]]');
    </script>
</body>

</html>
