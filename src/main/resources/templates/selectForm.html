<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: header('社員検索')"></head>
<body>
    <div th:if="${error}" style="color:red;">
        <p th:text="${error}"></p>
    </div>
    <div th:if="${error_select}" style="color:red;">
        <p th:text="${error_select}"></p>
    </div>

    <a th:href="@{/index}"><button type="button">メニュー</button></a>
    <a th:href="@{/insert}"><button type="button">登録</button></a>



    <form th:action="@{/selectResult}" th:object="${condition}" method="post">
        社員ID: <input type="text" th:field="*{id}" /><br>
        年齢: <input type="text" th:field="*{age_min}" /> ~ <input type="text" th:field="*{age_max}" /><br>
        社員名: <input type="text" th:field="*{name}" /><br>

        開始日:
        <input type="text" th:field="*{day_start_min}" placeholder="yyyy/MM/dd" pattern="\d{4}/\d{2}/\d{2}"
            title="yyyy/MM/dd 形式で入力">
        ~
        <input type="text" th:field="*{day_start_max}" placeholder="yyyy/MM/dd"><br>

        終了日:
        <input type="text" th:field="*{day_end_min}" placeholder="yyyy/MM/dd">
        ~
        <input type="text" th:field="*{day_end_max}" placeholder="yyyy/MM/dd"><br>

        <input type="submit" value="検索">
        <a th:href="@{/clearCondition}"><button type="button">クリア</button></a>
    </form>
    <table th:if="${error} == null">
        <tr>
            <th th:text="${count}"></th>
            <th>件</th>
        </tr>
    </table>
<form th:if="${error} == null" th:action="@{/delete}" method="post" id="deleteForm">
    <table th:if="${error} == null" border="1">
        <tr>
            <th></th>
            <th>ID</th>
            <th>氏名</th>
            <th>年</th>
            <th>開始日</th>
            <th>終了日</th>
        </tr>
        <tr th:each="user : ${userList}">
            <td>
                <input type="checkbox" name="selectedUser" th:value="${user.id}" class="userCheckbox" />
            </td>
            <td>
                <a th:href="@{/update/{id}(id=${user.id})}" th:text="${user.id}"></a>
            </td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.day_start}"></td>
            <td th:text="${user.day_end}"></td>
        </tr>
    </table>
    <input type="submit" id="deleteBtn" value="削除" disabled>
</form>

<script>
    // チェックボックスの取得
    const checkboxes = document.querySelectorAll('.userCheckbox');
    const deleteBtn = document.getElementById('deleteBtn');

    function toggleDeleteButton() {
        // 1つ以上チェックされていれば有効化
        const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
        deleteBtn.disabled = !anyChecked;
    }

    // チェックボックスにイベントリスナー
    checkboxes.forEach(cb => cb.addEventListener('change', toggleDeleteButton));

    // 念のためフォーム送信時のガード
    document.getElementById('deleteForm').addEventListener('submit', (e) => {
        const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
        if (!anyChecked) {
            e.preventDefault();
            alert('削除するユーザーを選択してください。');
        }
    });
</script>
    <!-- エラーメッセージがある場合のみポップアップ表示 -->
    <script th:if="${error != null}">
        alert('[[${error}]]');
    </script>
</body>

</html>
